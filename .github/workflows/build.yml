# Simpan di repo GitHub kamu sebagai: .github/workflows/build.yml
name: Build client
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build React
        working-directory: client
        run: |
          npm install
          CI=false npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/build
